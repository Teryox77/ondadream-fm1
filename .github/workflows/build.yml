# OndaDream: on every push to main, build the FM-1 package with the JieLi toolchain and the browser emulator, publish
# the site (installer + emulator) on GitHub Pages and the package as the release "latest".
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3-fonttools python3-pil xz-utils
          pip3 install --break-system-packages lz4 fonttools pillow

      - name: JieLi toolchain
        run: |
          mkdir -p "$HOME/.jieli"
          for i in 1 2 3; do curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C "$HOME/.jieli" && break; echo "retry $i"; sleep 20; done
          TC="$(ls -d "$HOME"/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$TC" "$HOME/.jieli/toolchain"
          test -x "$HOME/.jieli/toolchain/pi32v2/bin/clang"
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
          echo "--- runtime libraries in the toolchain:"; find -L "$HOME/.jieli/toolchain" -name "*.a" | grep -iv "x86\|host" | head -40

      - name: JieLi AC79 SDK (three files of it)
        run: |
          SDK="$HOME/fw-AC79_AIoT_SDK"
          URL=https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git
          TAG=AC79NN_SDK_V1.2.1_2023-12-13
          for i in 1 2 3; do
            rm -rf "$SDK"
            if git clone --depth 1 --branch "$TAG" --filter=blob:none --sparse "$URL" "$SDK" \
               && git -C "$SDK" sparse-checkout set cpu/wl82/tools; then break; fi
            rm -rf "$SDK"
            git clone --depth 1 --branch "$TAG" "$URL" "$SDK" && break
            echo "retry $i"; sleep 30
          done
          ls -la "$SDK/cpu/wl82/tools/uboot.boot" "$SDK/cpu/wl82/tools/cfg_tool.bin" "$SDK/cpu/wl82/tools/cfg/eq_cfg_hw.bin"
          echo "AC79_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Tests on the computer (sound of every preset, every page)
        run: |
          gcc -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc/core -Isrc/gen tests/synth_test.c -lm -o /tmp/synth_test && /tmp/synth_test
          gcc -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc/core -Isrc/gen tests/ui_test.c -lm -o /tmp/ui_test && /tmp/ui_test

      - name: Firmware
        run: |
          VER=$(sed -n 's/^#define OD_VERSION "v\([^"]*\)".*/\1/p' src/core/od.h)
          echo "VER=$VER" >> "$GITHUB_ENV"
          python3 tools/build_fm1.py --version "$VER"
          mkdir -p dist
          cp "build/fm1/ondadream-$VER.fwsc" dist/
          (cd dist && sha256sum *.fwsc > SHA256SUMS)

      - name: Browser emulator
        run: tools/build_web.sh

      - name: Site
        run: |
          python3 installer/make_installer.py "dist/ondadream-$VER.fwsc" "$VER" site
          mkdir -p site/webapp/try
          cp build/web/* site/webapp/try/
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>OndaDream</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>body{font:16px/1.6 -apple-system,system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;background:#141518;color:#e6e8eb}a{color:#ff7a1a}</style>
          <h1>OndaDream</h1>
          <p>Firmware per M-VAVE FM-1 · © 2026 Teryox77</p>
          <ul>
          <li><a href="webapp/try/">Provalo nel browser (emulatore)</a></li>
          <li><a href="webapp/installer/">Installa sull'FM-1 (Chrome o Edge, USB)</a></li>
          <li><a href="https://github.com/Teryox77/ondadream-fm1">Codice e licenze</a></li>
          </ul>
          HTML

      - name: Upload the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ondadream-build
          path: |
            dist/
            build/fm1/app/ondadream.sym
            build/fm1/app/ondadream.dis

      - name: Release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/*.fwsc dist/SHA256SUMS --prerelease \
            --title "OndaDream ${VER} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Installa dal sito: https://teryox77.github.io/ondadream-fm1/webapp/installer/ oppure scarica il file .fwsc qui sotto."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
