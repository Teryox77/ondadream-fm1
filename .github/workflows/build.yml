# OndaDream: on every push to main, build the FM-1 package with the JieLi toolchain and the browser emulator, publish
# the site (installer + emulator) on GitHub Pages and the package as the release "latest".
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3-fonttools python3-pil xz-utils
          pip3 install --break-system-packages lz4 fonttools pillow

      - name: JieLi toolchain
        run: |
          mkdir -p "$HOME/.jieli"
          for i in 1 2 3; do curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C "$HOME/.jieli" && break; echo "retry $i"; sleep 20; done
          TC="$(ls -d "$HOME"/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$TC" "$HOME/.jieli/toolchain"
          test -x "$HOME/.jieli/toolchain/pi32v2/bin/clang"
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
          echo "::warning title=toolchain::$(find -L "$HOME/.jieli/toolchain" -name '*.a' | sed "s#$HOME/.jieli/toolchain/##" | tr '\n' ' ' | head -c 3000)"

      - name: JieLi AC79 SDK (three files of it)
        run: |
          SDK="$HOME/fw-AC79_AIoT_SDK"
          URL=https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git
          TAG=AC79NN_SDK_V1.2.1_2023-12-13
          for i in 1 2 3; do
            rm -rf "$SDK"
            if git clone --depth 1 --branch "$TAG" --filter=blob:none --sparse "$URL" "$SDK" \
               && git -C "$SDK" sparse-checkout set --no-cone '/cpu/wl82/' '**/Makefile' '**/*.mk' '**/*.bat' '/tools/*.sh'; then break; fi
            rm -rf "$SDK"
            git clone --depth 1 --branch "$TAG" "$URL" "$SDK" && break
            echo "retry $i"; sleep 30
          done
          ls -la "$SDK/cpu/wl82/tools/uboot.boot" "$SDK/cpu/wl82/tools/cfg_tool.bin" "$SDK/cpu/wl82/tools/cfg/eq_cfg_hw.bin"
          echo "AC79_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Probe the compiler (float)
        run: |
          TC="$HOME/.jieli/toolchain"
          printf 'float f(float a,float b){return a*b+a/b;}\nint g(float a){return a<1.5f;}\n' > /tmp/p.c
          for fl in "" "-mcpu=r3" "-mcpu=r3 -mfpu" "-mhard-float" "-mcpu=r3 -mhard-float" "-mfloat-abi=hard"; do
            if "$TC/pi32v2/bin/clang" -target pi32v2 $fl -O2 -c /tmp/p.c -o /tmp/p.o 2>/tmp/p.err; then
              D=$("$TC/common/bin/objdump" -d /tmp/p.o | grep -v "^$" | tail -n +6 | tr '\t' ' ' | tr '\n' ';' | head -c 900)
            else D="ERR $(head -c 300 /tmp/p.err)"; fi
            echo "::warning title=probe [$fl]::$D"
          done
          ls "$TC/pi32v2/bin" | tr '\n' ' ' | head -c 1500 | sed 's/^/::warning title=bin::/'; echo
          F=$(grep -rlis "fpu" "$AC79_SDK/cpu/wl82" 2>/dev/null | head -8 | tr '\n' ' '); echo "::warning title=sdk fpu files::$F"
          for f in $(grep -rlis "fpu" "$AC79_SDK/cpu/wl82" --include=*.S --include=*.s --include=*.c --include=*.h 2>/dev/null | head -4); do echo "::warning title=fpu in $(basename $f)::$(grep -in -B2 -A4 fpu "$f" | head -30 | tr '\n' ';' | head -c 1500)"; done
          ls "$AC79_SDK/cpu/wl82" | tr '\n' ' ' | sed 's/^/::warning title=wl82::/'; echo
          grep -rhoE -- "-mcpu=[a-z0-9]+|-mfpu[=a-z0-9]*|-mfloat[=a-z-]*|-mhard-float|pi32v2/lib/[a-z0-9-]+" "$AC79_SDK" --include=Makefile* --include=*.mk --include=*.bat --include=*.sh 2>/dev/null | sort | uniq -c | sort -rn | head -20 | tr '\n' ';' | sed 's/^/::warning title=sdk flags::/'; echo

      - name: Tests on the computer (sound of every preset, every page)
        run: |
          gcc -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc/core -Isrc/gen tests/synth_test.c -lm -o /tmp/synth_test && /tmp/synth_test
          mkdir -p /tmp/odui
          gcc -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc/core -Isrc/gen tests/ui_test.c -lm -o /tmp/ui_test && /tmp/ui_test
          gcc -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc/core -Isrc/gen tests/knob_test.c -lm -o /tmp/knob_test && /tmp/knob_test

      - name: Firmware
        run: |
          VER=$(sed -n 's/^#define OD_VERSION "v\([^"]*\)".*/\1/p' src/core/od.h)
          echo "VER=$VER" >> "$GITHUB_ENV"
          export OD_LIBS="$JIELI_TOOLCHAIN/pi32v2/lib/libcompiler-rt.a"
          python3 tools/build_fm1.py --version "$VER"
          mkdir -p dist
          cp "build/fm1/ondadream-$VER.fwsc" dist/
          # the registers the code uses (the audio interrupt saves r0-r3 and calls C: an FPU with its own registers would need more)
          echo "::warning title=registers::$(grep -oE '\b(r[0-9]+|f[a-z]*[0-9]+|[a-z]*fp[a-z0-9]*)\b' build/fm1/app/ondadream.dis | sort | uniq -c | sort -rn | head -60 | tr -s ' ' | tr '\n' ';')"
          echo "::warning title=isr::$(awk '/<fm1_alnk0_irq>:/,/rts/' build/fm1/app/ondadream.dis | head -80 | cut -c1-90 | tr '\n' ';' | head -c 3500)"
          (cd dist && sha256sum *.fwsc > SHA256SUMS)

      - name: Browser emulator
        run: tools/build_web.sh

      - name: Site
        run: |
          python3 installer/make_installer.py "dist/ondadream-$VER.fwsc" "$VER" site
          mkdir -p site/webapp/try site/webapp/uboot
          cp build/web/* site/webapp/try/
          cp web/uboot/index.html site/webapp/uboot/
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>OndaDream</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>body{font:16px/1.6 -apple-system,system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;background:#141518;color:#e6e8eb}a{color:#ff7a1a}</style>
          <h1>OndaDream</h1>
          <p>Firmware per M-VAVE FM-1 · © 2026 Teryox77</p>
          <ul>
          <li><a href="webapp/try/">Provalo nel browser (emulatore)</a></li>
          <li><a href="webapp/installer/">Installa sull'FM-1 (Chrome o Edge, USB)</a></li>
          <li><a href="https://github.com/Teryox77/ondadream-fm1">Codice e licenze</a></li>
          </ul>
          HTML

      - name: Upload the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ondadream-build
          path: |
            dist/
            build/fm1/app/ondadream.sym
            build/fm1/app/ondadream.dis

      - name: Release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/*.fwsc dist/SHA256SUMS --prerelease \
            --title "OndaDream ${VER} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Installa dal sito: https://teryox77.github.io/ondadream-fm1/webapp/installer/ oppure scarica il file .fwsc qui sotto."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
